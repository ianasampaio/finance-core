services:
  postgres:
    image: 'postgres:16.2-alpine3.18'
    env_file:
      - .env
    container_name: postgres
    ports:
      - '5432:5432'
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest